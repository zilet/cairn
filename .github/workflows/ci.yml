name: CI

# Offline test gate. Runs on pushes to main and on every PR. Tag pushes are
# intentionally excluded because the release workflow runs the same npm test gate
# and browser smoke before building and publishing the image.
on:
  push:
    branches: [main]
  pull_request:

# Never let two runs for the same ref pile up; cancel the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "26.12.1"
            experimental: false
          - node: "24.22.1"
            experimental: false
    steps:
      - name: Checkout
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Full history so the PWA service-worker cache-bump guard can diff a PR
          # against its base branch.
          fetch-depth: 0

      - name: Set up Node ${{ matrix.node }}
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned action tags
        if: startsWith(matrix.node, '24.')
        run: npm run actions:check -- --remote

      - name: Verify
        if: startsWith(matrix.node, '24.')
        run: npm run verify

      - name: Node 26 compatibility build
        if: startsWith(matrix.node, '26.')
        run: npm run build

      - name: Node 26 compatibility tests
        if: startsWith(matrix.node, '26.')
        run: npm run test:built

      - name: Runtime smoke
        if: startsWith(matrix.node, '24.')
        run: npm run smoke

  browser-smoke:
    # The PWA in a real headless Chrome (scripts/smoke-browser.mjs): every route boots
    # and the core workflows run without a runtime error, against the demo seed. The
    # checks `npm run verify` cannot see — script order, lazy-bundle injection, a missing
    # global — so it gates like the tests do. Its own job: it needs Chrome and a build.
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node 26
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Browser smoke
        env:
          # The hosted Ubuntu image ships Google Chrome (found at its standard path).
          # Ubuntu 24.04 restricts the unprivileged user namespaces Chrome's own
          # sandbox needs, and the page it loads is this job's local build.
          CAIRN_CHROME_NO_SANDBOX: "1"
        run: npm run smoke:browser:built

  perf:
    # Per-route load budget (scripts/check-perf.mjs): real headless Chrome on a
    # throttled mid-phone profile against the demo seed. Its own job because it needs
    # Chrome and ~15 minutes. Blocking: the gate reads only measures that do not move
    # with the runner's speed (rounds come from a wave-gated load, bytes with the idle
    # bundle warm-up off); timings are report-only.
    name: Perf budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node 26
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Perf budget
        env:
          # The hosted Ubuntu image ships Google Chrome (found at its standard path).
          # Ubuntu 24.04 restricts the unprivileged user namespaces Chrome's own
          # sandbox needs, and the page it loads is this job's local build.
          CAIRN_CHROME_NO_SANDBOX: "1"
        run: npm run perf:check

