name: CI

# Offline test gate. Runs on pushes to main and on every PR. Tag pushes are
# intentionally excluded because the release workflow runs the same npm test gate
# before building and publishing the image.
on:
  push:
    branches: [main]
  pull_request:

# Never let two runs for the same ref pile up; cancel the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24
            experimental: false
          - node: 26
            experimental: true
    steps:
      - name: Checkout
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Full history so the PWA service-worker cache-bump guard can diff a PR
          # against its base branch.
          fetch-depth: 0

      - name: Set up Node ${{ matrix.node }}
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned action tags
        if: matrix.node == 24
        run: npm run actions:check -- --remote

      - name: Verify
        if: matrix.node == 24
        run: npm run verify

      - name: Node 26 compatibility build
        if: matrix.node == 26
        run: npm run build

      - name: Node 26 compatibility tests
        if: matrix.node == 26
        run: npm run test:built

      - name: Runtime smoke
        if: matrix.node == 24
        run: npm run smoke
