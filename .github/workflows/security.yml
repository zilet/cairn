name: Security

# Advisories land against a lockfile that has not changed, so a clean CI run last week says
# nothing about today. This re-audits the committed lockfile every week (and whenever the
# dependency set changes), so a new CVE in something Cairn ships shows up as a red run
# rather than waiting for the next manual `npm audit`. Separate from CI on purpose: a
# freshly published advisory must not block an unrelated PR.
on:
  schedule:
    # Mondays 06:17 UTC (off the top of the hour, when scheduled runs queue up).
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .npmrc
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .npmrc
      - .github/workflows/**

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node 26
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      # Fails on a high or critical advisory in anything the image ships (production deps).
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      # The whole tree, dev tooling included, for the record. Report-only: dev deps never
      # reach the image, so they should not turn the run red on their own.
      - name: Audit full tree (report only)
        continue-on-error: true
        run: npm audit

      # Registry signatures and provenance attestations for every installed package: a
      # tarball that does not match what the registry signed fails here.
      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Verify registry signatures
        run: npm audit signatures

      # A retagged or force-moved action tag (a known supply-chain move) fails here.
      - name: Verify pinned action tags
        run: npm run actions:check -- --remote
