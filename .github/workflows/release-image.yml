name: Release Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# One release per ref; don't cancel a push that's already uploading layers.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node 26
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned action tags
        run: npm run actions:check -- --remote

      - name: Verify
        run: npm run verify

      - name: Runtime smoke
        run: npm run smoke

  browser-smoke:
    # The PWA in a real headless Chrome against the tagged commit (scripts/smoke-browser.mjs),
    # the same job as CI's: every route boots and the core workflows run without a runtime
    # error. `npm run verify` cannot see script order, lazy-bundle injection or a missing
    # global, and a release that only verified once shipped a broken browser smoke — so no
    # image, :latest or GitHub release is published unless it passes here too.
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node 26
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Browser smoke
        env:
          # The hosted Ubuntu image ships Google Chrome (found at its standard path).
          # Ubuntu 24.04 restricts the unprivileged user namespaces Chrome's own
          # sandbox needs, and the page it loads is this job's local build.
          CAIRN_CHROME_NO_SANDBOX: "1"
        run: npm run smoke:browser:built

  build:
    name: Build ${{ matrix.arch }}
    # Both gates must pass for the tagged commit before any image layer is pushed.
    needs: [verify, browser-smoke]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        # docker/login-action v4.7.0
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        # docker/metadata-action v6.2.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag,suffix=-${{ matrix.arch }}
            type=semver,pattern=v{{major}}.{{minor}},suffix=-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge-${{ matrix.arch }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push ${{ matrix.arch }}
        # docker/build-push-action v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the exact tag into the image so the in-app update check reports a
          # precise running version even on the :latest tag. Non-tag dispatch
          # builds pass a branch name, which version.ts ignores (→ package.json).
          build-args: |
            CAIRN_VERSION=${{ github.ref_name }}
            CAIRN_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    name: Publish manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        # docker/login-action v4.7.0
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        # docker/metadata-action v6.2.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          mapfile -t tags <<< "${TAGS}"
          first="${tags[0]}"
          repo="${first%:*}"
          version="${first##*:}"
          args=()
          for tag in "${tags[@]}"; do
            args+=("-t" "${tag}")
          done
          docker buildx imagetools create \
            "${args[@]}" \
            "${repo}:${version}-amd64" \
            "${repo}:${version}-arm64"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

      - name: Prepare release compose file
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          image="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          sed "s|ghcr.io/zilet/cairn:latest|${image}|g" deploy/docker-compose.release.yml > docker-compose.yml

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        # softprops/action-gh-release v3.0.3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: docker-compose.yml
          generate_release_notes: true
